[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-signal-notifier"
version = "0.1.0"
description = "Free-tier-aware US stock data pipeline and dashboard"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.5,<1"]

[project.scripts]
stock-notifier = "stock_notifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

